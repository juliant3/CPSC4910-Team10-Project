{% extends "shared/base.html" %}

{% block title %}Create Account{% endblock %}

{% block content %}

<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

<div class="login-container">

    <h1>Create Account</h1>
    <p class="motto">Join Drivers Advantage</p>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('register') }}">

        <label for="role">Account Type</label>

        <select
            name="role"
            id="role"
            required
            onchange="showRoleFields()"
        >
            <option value="">Select Account Type</option>
            <option value="Driver">Driver</option>
            <option value="Sponsor">Sponsor</option>
        </select>


        <input
            type="text"
            name="first_name"
            placeholder="First Name"
            required
        >


        <input
            type="text"
            name="last_name"
            placeholder="Last Name"
            required
        >


        <!-- Only appears for Sponsors -->
        <div id="sponsor-fields" style="display: none;">

            <input
                type="text"
                name="company_name"
                id="company_name"
                placeholder="Company Name"
            >

            <input
                type="tel"
                name="phone"
                id="phone"
                placeholder="Company Phone (optional)"
            >

        </div>


        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >


        <div class="password-wrapper">

            <input
                type="password"
                name="password"
                id="register_password"
                placeholder="Password"
                required
            >

            <button
                type="button"
                class="toggle-password"
                onclick="togglePassword('register_password', this)"
            >
                Show
            </button>

        </div>


        <div class="password-wrapper">

            <input
                type="password"
                name="confirm_password"
                id="confirm_password"
                placeholder="Confirm Password"
                required
            >

            <button
                type="button"
                class="toggle-password"
                onclick="togglePassword('confirm_password', this)"
            >
                Show
            </button>

        </div>


        <button type="submit">
            Create Account
        </button>

    </form>


    <p>
        Already have an account?
        <a href="{{ url_for('login') }}">Log In</a>
    </p>

</div>


<script>

function togglePassword(inputId, btn) {

    const input = document.getElementById(inputId);

    if (input.type === "password") {
        input.type = "text";
        btn.textContent = "Hide";
    } else {
        input.type = "password";
        btn.textContent = "Show";
    }
}


function showRoleFields() {

    const role = document.getElementById("role").value;

    const sponsorFields =
        document.getElementById("sponsor-fields");

    const companyName =
        document.getElementById("company_name");


    if (role === "Sponsor") {

        sponsorFields.style.display = "block";

        companyName.required = true;

    } else {

        sponsorFields.style.display = "none";

        companyName.required = false;

    }
}

</script>

{% endblock %}
