<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{% block title %}Good Driver Program{% endblock %} · Good Driver Program</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">

<link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
{% block head %}{% endblock %}
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/session-timeout.css') }}">
</head>
<body>

    {% include "shared/_navbar.html" %}

    <main class="site-main">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="site-footer-inner">
            <span>&copy; {{ current_year }} Good Driver Program &middot; CPSC 4910 Team 10</span>
            <nav class="site-footer-links">
                <a href="{{ url_for('about') }}">About</a>
                {% if session.get('user_id') %}
                    <a href="{{ url_for('home') }}">Dashboard</a>
                {% else %}
                    <a href="{{ url_for('login') }}">Log In</a>
                {% endif %}
            </nav>
        </div>
    </footer>

    {% if session.get('user_id') %}
        <script src="{{ url_for('static', filename='js/main.js') }}"></script>
        <!-- Automatically log out after 5 minutes of inactivity -->
        <script src="{{ url_for('static', filename='js/session-timeout.js') }}"></script>
    {% endif %}
</body>
</html>
