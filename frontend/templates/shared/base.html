<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{% block title %}Flask App{% endblock %}</title>
{% block head %}{% endblock %}
</head>

<body>
    {% if session.get('user_id') %}
    <a href="{{ url_for('notifications') }}"
       title="Notifications"
       style="position: fixed; right: 20px; bottom: 20px; z-index: 1000; width: 52px; height: 52px; border-radius: 50%; background: #4C2A85; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 2px 8px rgba(0,0,0,0.25);">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        {% if unread_count and unread_count > 0 %}
        <span style="position: absolute; top: -4px; right: -4px; background: #D9662C; color: #fff; border-radius: 10px; min-width: 20px; height: 20px; padding: 0 5px; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;">{{ unread_count }}</span>
        {% endif %}
    </a>
    {% endif %}

    {% block content %}{% endblock %}
</body>
</html>
